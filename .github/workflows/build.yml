name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            # For the "skip changelog" label in the changelog job.
            - labeled
            - unlabeled

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            source: ${{ steps.filter.outputs.source }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 2
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              with:
                  filters: |
                      source:
                        - 'src/**'
                        - 'include/**'
                        - 'python/**'
                        - 'CMakeLists.txt'
                        - 'pyproject.toml'
                        - 'examples/**'
                        - 'tests/**'
                        - '.github/workflows/build.yml'

    test:
        needs: [changes]
        if: needs.changes.outputs.source == 'true' || startsWith(github.ref, 'refs/tags/v')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-15-intel, windows-latest]
                build-type: [Debug, Release]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.14"

            - name: Configure
              run: >
                  cmake -B build
                  -DUNIT_BUILD_EXAMPLES=on
                  -DUNIT_BUILD_TESTS=on
                  ${{ runner.os == 'Windows' && '-T ClangCL' || format('-DCMAKE_BUILD_TYPE={0}', matrix.build-type) }}

            - name: Build
              run: cmake --build build --config ${{ matrix.build-type }}

            - name: Run tests
              run: cmake --build build --config ${{ matrix.build-type }} --target tests --target python_tests

    build-sdist:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.14"

            - name: Build sdist
              run: pipx run build --sdist

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: sdist
                  path: dist/*.tar.gz

    build-wheels:
        needs: [test]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-15-intel, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
              env:
                  CIBW_BUILD: cp314-*
                  CIBW_SKIP: "*-musllinux_*"
                  CIBW_ARCHS_LINUX: x86_64
                  CIBW_ARCHS_MACOS: x86_64
                  CIBW_ARCHS_WINDOWS: AMD64
                  CIBW_ENVIRONMENT_WINDOWS: CMAKE_GENERATOR_TOOLSET=ClangCL
                  # For when we add Mac and Windows support:
                  # CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests/python -v

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-${{ matrix.os }}
                  path: wheelhouse/*.whl

    publish:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'dev') && !contains(github.ref, 'a') && !contains(github.ref, 'b') && !contains(github.ref, 'rc')
        permissions:
            id-token: write
        environment:
            name: pypi
            url: https://pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

    publish-testpypi:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v') && (contains(github.ref, 'dev') || contains(github.ref, 'a') || contains(github.ref, 'b') || contains(github.ref, 'rc'))
        permissions:
            id-token: write
        environment:
            name: testpypi
            url: https://test.pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
              with:
                  repository-url: https://test.pypi.org/legacy/

    changelog:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Check for changelog updates
              uses: brettcannon/check-for-changed-files@d85c64d17b3c1d0ac57c9cc46ea39399b0d6fa71 # v1.2.2
              with:
                  prereq-pattern: |
                      src/**
                      include/**
                      python/**
                  file-pattern: CHANGES.rst
                  skip-label: "skip changelog"
                  failure-message: "Missing a CHANGES.rst update; please add one or apply the ${skip-label} label to the pull request"
                  token: ${{ secrets.GITHUB_TOKEN }}

    check:
        if: always()
        needs: [test, build-sdist, build-wheels, changelog]
        runs-on: ubuntu-latest
        steps:
            - name: Decide status
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ||
                        "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                    echo "One or more jobs failed or were cancelled"
                    exit 1
                  fi
                  echo "All jobs passed or were skipped"

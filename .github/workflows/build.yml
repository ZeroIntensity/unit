name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            source: ${{ steps.filter.outputs.source }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false
                  fetch-depth: 2
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              with:
                  filters: |
                      source:
                        - 'src/**'
                        - 'include/**'
                        - 'python/**'
                        - 'CMakeLists.txt'
                        - 'pyproject.toml'
                        - 'examples/**'
                        - 'tests/**'
                        - '.github/workflows/build.yml'

    test:
        needs: [changes]
        if: needs.changes.outputs.source == 'true'
        strategy:
            fail-fast: false
            matrix:
                build-type: [Debug, Release]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.14"

            - name: Configure
              run: >
                  cmake -B build
                  -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
                  -DUNIT_BUILD_EXAMPLES=on
                  -DUNIT_BUILD_TESTS=on
                  ${{ runner.os == 'Windows' && '-T ClangCL' || '' }}

            - name: Install valgrind
              run: sudo apt-get update && sudo apt-get install -y valgrind

            - name: Build
              run: cmake --build build

            - name: Run tests
              run: cmake --build build --target tests --target python_tests

            - name: Run examples under valgrind
              run: |
                  for example in build/unit_*; do
                    if [ -x "$example" ] && [ -f "$example" ]; then
                      echo "=== Running $example ==="
                      valgrind --error-exitcode=1 --leak-check=full "$example" || exit 1
                    fi
                  done

    build-sdist:
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: "3.14"

            - name: Build sdist
              run: pipx run build --sdist

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: sdist
                  path: dist/*.tar.gz

    build-wheels:
        needs: [test]
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1.0
              env:
                  CIBW_BUILD: cp314-*
                  CIBW_SKIP: "*-musllinux_*"
                  CIBW_ARCHS_LINUX: x86_64
                  CIBW_ARCHS_MACOS: x86_64 arm64
                  CIBW_ARCHS_WINDOWS: AMD64
                  CIBW_ENVIRONMENT_WINDOWS: CMAKE_GENERATOR_TOOLSET=ClangCL
                  # For when we add Mac and Windows support:
                  # CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests/python -v

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: wheels-${{ matrix.os }}
                  path: wheelhouse/*.whl

    publish:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            id-token: write
        environment:
            name: pypi
            url: https://pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

    publish-testpypi:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        permissions:
            id-token: write
        environment:
            name: testpypi
            url: https://test.pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
              with:
                  repository-url: https://test.pypi.org/legacy/

    check:
        if: always()
        needs: [test, build-sdist, build-wheels]
        runs-on: ubuntu-latest
        steps:
            - name: Decide status
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ||
                        "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                    echo "One or more jobs failed or were cancelled"
                    exit 1
                  fi
                  echo "All jobs passed or were skipped"

name: Build

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            source: ${{ steps.filter.outputs.source }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      source:
                        - 'src/**'
                        - 'include/**'
                        - 'python/**'
                        - 'CMakeLists.txt'
                        - 'pyproject.toml'
                        - 'examples/**'
                        - 'tests/**'

    test:
        needs: [changes]
        if: needs.changes.outputs.source == 'true'
        strategy:
            fail-fast: false
            matrix:
                build-type: [Debug, Release]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Configure
              run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DUNIT_BUILD_EXAMPLES=on -DUNIT_BUILD_TESTS=on

            - name: Build
              run: cmake --build build

            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.14"
                  allow-prereleases: true

            - name: Run tests
              run: cmake --build build --target tests --target python_tests

    valgrind:
        needs: [changes]
        if: needs.changes.outputs.source == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - name: Install valgrind
              run: sudo apt-get update && sudo apt-get install -y valgrind

            - name: Configure
              run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

            - name: Build
              run: cmake --build build

            - name: Run examples under valgrind
              run: |
                  for example in build/examples/*; do
                    if [ -x "$example" ] && [ -f "$example" ]; then
                      echo "=== Running $example ==="
                      valgrind --error-exitcode=1 --leak-check=full "$example" || exit 1
                    fi
                  done

    build-sdist:
        needs: [test, valgrind]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.14"
                  allow-prereleases: true

            - name: Build sdist
              run: pipx run build --sdist

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: sdist
                  path: dist/*.tar.gz

    build-wheels:
        needs: [test, valgrind]
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false

            - uses: pypa/cibuildwheel@f03ac7617d6cff873ccf24cc0d567ef5ba5a9e6d # v4.0.0
              env:
                  CIBW_BUILD: cp314-*
                  CIBW_SKIP: "*-musllinux_*"
                  CIBW_ARCHS_LINUX: x86_64
                  CIBW_ARCHS_MACOS: x86_64 arm64
                  CIBW_ARCHS_WINDOWS: AMD64
                  CIBW_TEST_COMMAND: python -m unittest discover -s {project}/tests/python -v

            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheels-${{ matrix.os }}
                  path: wheelhouse/*.whl

    publish:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            id-token: write
        environment:
            name: pypi
            url: https://pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4

    publish-testpypi:
        needs: [build-sdist, build-wheels]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        permissions:
            id-token: write
        environment:
            name: testpypi
            url: https://test.pypi.org/p/unit-compiler
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  path: dist
                  merge-multiple: true

            - uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
              with:
                  repository-url: https://test.pypi.org/legacy/

    check:
        if: always()
        needs: [test, valgrind, build-sdist, build-wheels]
        runs-on: ubuntu-latest
        steps:
            - name: Decide status
              run: |
                  if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ||
                        "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
                    echo "One or more jobs failed or were cancelled"
                    exit 1
                  fi
                  echo "All jobs passed or were skipped"
